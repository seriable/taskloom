name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features
      - run: cargo test --locked --all-features
      - run: cargo doc --locked --no-deps --all-features

  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "openai", "anthropic", "schemars", "runtime", "runtime,openai", "runtime,anthropic", "mcp", "research", "app"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-default-features --features "${{ matrix.features }}"
      - run: cargo doc --locked --no-deps --no-default-features --features "${{ matrix.features }}"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked --example basic
      - run: cargo run --locked --example record_replay
      - run: cargo run --locked --example production
      - run: cargo run --locked --example eval
      - run: cargo run --locked --features runtime --example agent_loop
      - run: cargo run --locked --features runtime --example agent_resume
      - run: cargo run --locked --features runtime --example agent_session
      - run: cargo run --locked --features runtime --example agent_peer
      - run: cargo run --locked --features runtime --example agent_research
      - name: Install explicit PDF extractor
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Exercise real PDF extraction
        env:
          TASKLOOM_TEST_PDFTOTEXT: /usr/bin/pdftotext
        run: cargo test --locked --features research --test agent_pdf -- --ignored
      - run: cargo package --locked --all-features
