name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features
      - run: cargo test --locked --all-features
      - run: cargo doc --locked --no-deps --all-features

  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "openai", "anthropic", "schemars", "runtime", "runtime,openai", "runtime,anthropic", "mcp", "research", "sandbox", "app"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-default-features --features "${{ matrix.features }}"
      - run: cargo doc --locked --no-deps --no-default-features --features "${{ matrix.features }}"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked --example basic
      - run: cargo run --locked --example record_replay
      - run: cargo run --locked --example production
      - run: cargo run --locked --example eval
      - run: cargo run --locked --features runtime --example agent_loop
      - run: cargo run --locked --features runtime --example agent_resume
      - run: cargo run --locked --features runtime --example agent_session
      - run: cargo run --locked --features runtime --example agent_peer
      - run: cargo run --locked --features runtime --example agent_research
      # app_approval is an interactive server and never exits, so it is only
      # built here; the offline CLI flow below exercises the application.
      - run: cargo build --locked --features app --example app_approval
      - name: Offline application CLI flow (no provider credentials)
        shell: bash
        run: |
          set -euo pipefail
          demo=$(mktemp -d)
          cargo run --quiet --locked --features app --bin taskloom -- init "$demo/taskloom.json"
          taskloom() { cargo run --quiet --locked --features app --bin taskloom -- --config "$demo/taskloom.json" "$@"; }
          taskloom import approval "Approval guide" examples/knowledge/approval.md
          taskloom import recovery "Recovery guide" examples/knowledge/recovery.md
          taskloom run research "approval recovery" > /dev/null
          taskloom report research > /dev/null
          taskloom resume research > /dev/null
      - name: Install explicit PDF extractor
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Exercise real PDF extraction
        env:
          TASKLOOM_TEST_PDFTOTEXT: /usr/bin/pdftotext
        run: cargo test --locked --features research --test agent_pdf -- --ignored
      - run: cargo package --locked --all-features

  sandbox-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve trusted base and build audited supervisor image
        shell: bash
        run: |
          docker pull python:3.12-slim
          base_image=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)
          [[ "$base_image" =~ ^python@sha256:[0-9a-f]{64}$ ]]
          docker build --platform linux/amd64 --build-arg BASE_IMAGE="$base_image" -t taskloom-sandbox:ci sandbox/python
          sandbox_image=$(docker image inspect --format '{{.Id}}' taskloom-sandbox:ci)
          [[ "$sandbox_image" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'TASKLOOM_SANDBOX_IMAGE=%s\n' "$sandbox_image" >> "$GITHUB_ENV"
          printf 'base=%s\nimage=%s\n' "$base_image" "$sandbox_image" > sandbox-image-provenance.txt
      - name: Real Linux-container acceptance
        env:
          TASKLOOM_SANDBOX_DOCKER: /usr/bin/docker
          TASKLOOM_SANDBOX_ENDPOINT: unix:///var/run/docker.sock
        run: cargo test --locked --features sandbox --test agent_sandbox -- --ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-image-provenance
          path: sandbox-image-provenance.txt
          if-no-files-found: ignore
