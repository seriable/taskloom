apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskloom.fullname" . }}
  labels:
    {{- include "taskloom.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskloom
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
