[package]
name = "taskloom"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Typed LLM task execution: model chains, resilient JSON, deadlines, circuit breakers, call accounting, record/replay and step caching."
readme = "README.md"
keywords = ["llm", "agent", "openai", "anthropic", "gateway"]
categories = ["api-bindings", "asynchronous"]
repository = "https://github.com/seriable/taskloom"
include = ["src/**", "examples/**", "tests/**", "docs/**", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE-*"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# The OpenAI-compatible provider (chat completions over HTTP).
openai = ["dep:reqwest", "dep:base64"]
# The Anthropic Messages API provider.
anthropic = ["dep:reqwest", "dep:base64"]
# `TaskSpec::schema_of::<T>()` from a `schemars::JsonSchema` type.
schemars = ["dep:schemars"]

[dependencies]
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "macros"] }
tracing = "0.1"

[[example]]
name = "openai"
required-features = ["openai"]

[[example]]
name = "anthropic"
required-features = ["anthropic"]

[dev-dependencies]
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "macros", "rt-multi-thread", "net", "io-util", "test-util"] }
