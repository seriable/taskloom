[package]
name = "taskloom"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Typed LLM tasks and durable agents: native tools, approvals, recovery, bounded workflows, RAG, MCP and a local API/CLI/UI."
readme = "README.md"
keywords = ["llm", "agent", "openai", "anthropic", "gateway"]
categories = ["api-bindings", "asynchronous"]
repository = "https://github.com/seriable/taskloom"
include = ["src/**", "examples/**", "!examples/**/__pycache__/**", "!examples/**/*.pyc", "tests/**", "docs/**", "sandbox/**", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE-*"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# The OpenAI-compatible provider (chat completions over HTTP).
openai = ["dep:reqwest", "dep:base64"]
# The Anthropic Messages API provider.
anthropic = ["dep:reqwest", "dep:base64"]
# `TaskSpec::schema_of::<T>()` from a `schemars::JsonSchema` type.
schemars = ["dep:schemars"]
# Autonomous tool execution, kept separate from the typed single-task API.
runtime = ["dep:jsonschema", "dep:uuid"]
# Explicitly configured MCP Streamable HTTP tool clients.
mcp = ["runtime", "dep:reqwest"]
# Opt-in bounded web ingestion/search and a configured PDF text extractor.
research = ["runtime", "dep:reqwest", "dep:scraper", "dep:html5ever", "tokio/net", "tokio/process", "tokio/io-util"]
# Explicit Linux-container Python execution, never a host-shell fallback.
sandbox = ["runtime", "dep:base64", "tokio/process", "tokio/io-util"]
# Local API/CLI/UI host; library-only users retain the minimal default build.
app = ["mcp", "research", "sandbox", "openai", "anthropic", "dep:axum", "tokio/net", "tokio/rt-multi-thread", "tokio/signal"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
# Must be the html5ever release scraper is built on (scraper 0.23 uses 0.29):
# the bounded parser feeds scraper's tree sink through html5ever's types.
# Upgrade both together.
html5ever = { version = "0.29", optional = true }
jsonschema = { version = "0.29", default-features = false, optional = true }
# jsonschema accepts newer uuid releases whose MSRV exceeds Rust 1.86.
# Constrain downstream resolution too, not only this repository's lockfile.
uuid = { version = "=1.18.1", default-features = false, optional = true }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
schemars = { version = "1", optional = true }
scraper = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"] }
# Persisted tool values participate in exact context/approval fingerprints.
# Parse decimal f64 values with round-trip precision across checkpoint reloads.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "macros"] }
tracing = "0.1"

[[example]]
name = "openai"
required-features = ["openai"]

[[example]]
name = "anthropic"
required-features = ["anthropic"]

[[example]]
name = "agent_loop"
required-features = ["runtime"]

[[example]]
name = "agent_openai"
required-features = ["runtime", "openai"]

[[example]]
name = "agent_resume"
required-features = ["runtime"]

[[example]]
name = "agent_session"
required-features = ["runtime"]

[[example]]
name = "agent_peer"
required-features = ["runtime"]

[[example]]
name = "agent_research"
required-features = ["runtime"]

[[example]]
name = "app_approval"
required-features = ["app"]

[[example]]
name = "benchmark_citations"
path = "examples/benchmarks/citations.rs"
required-features = ["runtime"]

[dev-dependencies]
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "macros", "rt-multi-thread", "net", "io-util", "test-util"] }

[[bin]]
name = "taskloom"
path = "src/bin/taskloom.rs"
required-features = ["app"]
